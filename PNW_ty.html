<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/jpg" href="images/PNW_Logo_Transparent.png">
    <title>PNW Accountants | Thank You!</title>
    <meta name="description" content="Thank you for submitting a callback">

    <style>
        :root {
            --text: #1f2933;
            --muted: #667085;
            --heading: #111827;
            --accent: #1f5f4a;
            --background: #ffffff;
            --border: #e5e7eb;
            --max-width: 820px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: var(--background);
            line-height: 1.7;
        }

        header {
            padding: 24px 20px;
        }

        .header-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            color: var(--heading);
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 700;
        }
        .header-inner img {
            height: 100px;
            width: auto;
        }
        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 70px 20px 90px;
        }
        .hero{
            padding:60px 0 100px;
        }
        .hero h1{
            font-size:4rem;
            line-height:1.1;
            margin-bottom:24px;
        }
        h1 {
            color: var(--heading);
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.2;
            margin: 0 0 12px;
        }

        h2 {
            color: var(--heading);
            font-size: 1.4rem;
            margin-top: 42px;
            margin-bottom: 12px;
        }

        p {
            margin: 0 0 18px;
        }

        ul {
            margin: 0 0 20px;
            padding-left: 24px;
        }

        li {
            margin-bottom: 8px;
        }

        .updated {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 42px;
        }

        a {
            color: var(--accent);
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 30px 20px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .footer-inner {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 12px;
        }

        .footer-links a {
            color: var(--muted);
            text-decoration: none;
        }

        .footer-links a:hover {
            color: var(--heading);
        }
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;

            background-image: url("images/rainier-background.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            opacity: 0.15;
            filter: grayscale(100%);

            z-index: -1;
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <a href="index.html"> <img src="images/PNW_Logo_Transparent.png"></a>
    </div>
</header>
<section class="hero">

    <div class="hero-overlay"></div>


<div class="hero-grid">

</div>

<h1 style="text-align: center;">
Thanks for getting in touch!
</h1>

<h2 style="text-align: center;">
Your callback request has been received. <br>
One of our team will be in touch shortly to discuss your enquiry and answer any questions you may have.
</h2>


</section>
</body>
</html>
